# fly.toml app configuration file generated for jarvis-durrani-2026 on 2026-05-17T11:13:58+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jarvis-durrani-2026'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'

[env]
  CHROMA_DIR = '/data/chroma'
  GROQ_CHAT_MODEL = 'llama-3.3-70b-versatile'
  GROQ_ROUTER_MODEL = 'llama-3.1-8b-instant'
  HF_HOME = '/opt/models/huggingface'
  JARVIS_DATA_DIR = '/data'
  LLM_BACKEND = 'groq'
  PORT = '8000'
  RUNNING_IN_DOCKER = '1'
  SENTENCE_TRANSFORMERS_HOME = '/opt/models/sentence-transformers'
  UI_HOST = '0.0.0.0'
  UI_PORT = '8000'
  XDG_CACHE_HOME = '/opt/models/cache'

[[mounts]]
  source = 'jarvis_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
